<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Forms</title>
</head>
<body>
  <form action="/" method="POST">
    <fieldset>
      <legend>Add User</legend>
      <div>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="first_name" />
      </div>

      <div>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="last_name" />
      </div>

      <div>
        <label for="email">Last Name</label>
        <input type="email" id="email" name="email_address" />
      </div>

      <div>
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="student">Student</option>
          <option value="instructor">Instructor</option>
          <option value="guest">Guest</option>
        </select>
      </div>
      
      <div>
        <p>Choose your favorite programming language:</p>
        <div>
          <input type="radio" id="html" name="language" />
          <label for="html">HTML</label>
          <input type="radio" id="css" name="language" />
          <label for="css">CSS</label>
          <input type="radio" id="javascript" name="language" />
          <label for="javascript">JavaScript</label>
        </div>
      </div>

      <div>
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments"></textarea>
      </div>

      <div>
        <label for="date">Current Date</label>
        <input type="date" id="date" name="current_date" />
      </div>

      <div>
        <input type="checkbox" id="signup" name="newsletter" />
        <label for="signup">Sign up for newsletter</label>
        <input type="checkbox" id="agreement" name="terms_and_conditions" />
        <label for="agreement">Agree to terms and conditions</label>
      </div>

      <div>
        <button type="submit">Submit</button>
      </div>
    </fieldset>
  </form>
</body>
</html>
